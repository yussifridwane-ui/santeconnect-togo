# ============================================================
# Configuration de déploiement Netlify — SantéConnect Togo
# Créé pour Ridwane Issifou
# ============================================================

[build]
  command = "npm run build"
  publish = ".next"

# Plugin officiel Next.js pour Netlify
# (gère automatiquement le SSR, les API routes /app/api/*, et l'ISR)
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# ============================================================
# Domaine dédié SikaStock : sikastock.tg
# Quand ce domaine pointe vers ce site, la racine sert SikaStock
# (les API, assets et la connexion restent partagés).
# ============================================================
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  conditions = {Host = ["sikastock.tg", "www.sikastock.tg", "sikastock.netlify.app", "sikastock-togo.netlify.app", "sikastocktg.netlify.app"]}

[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200
  conditions = {Host = ["sikastock.tg", "www.sikastock.tg", "sikastock.netlify.app", "sikastock-togo.netlify.app", "sikastocktg.netlify.app"]}

[[redirects]]
  from = "/login"
  to = "/login"
  status = 200
  conditions = {Host = ["sikastock.tg", "www.sikastock.tg", "sikastock.netlify.app", "sikastock-togo.netlify.app", "sikastocktg.netlify.app"]}

[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard/:splat"
  status = 200
  conditions = {Host = ["sikastock.tg", "www.sikastock.tg", "sikastock.netlify.app", "sikastock-togo.netlify.app", "sikastocktg.netlify.app"]}

[[redirects]]
  from = "/*"
  to = "/sika/:splat"
  status = 200
  conditions = {Host = ["sikastock.tg", "www.sikastock.tg", "sikastock.netlify.app", "sikastock-togo.netlify.app", "sikastocktg.netlify.app"]}

# 🔐 En-têtes de sécurité renforcés pour une app médicale (audit V2.8)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    # HTTPS forcé 1 an (HSTS) — aucune connexion en clair n'est acceptée ensuite
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Aucun accès micro/géoloc par défaut — caméra uniquement pour NOTRE
    # site (scanner QR des cartes d'assurance V3.1), jamais pour les autres
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    # CSP pragmatique Next.js : scripts/styles inline autorisés (hydratation),
    # aucun domaine externe, aucun iframe embarqué
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"

# NOTE IMPORTANTE :
# Les variables DATABASE_URL et JWT_SECRET ne doivent JAMAIS être
# écrites ici. Configurez-les dans l'interface Netlify :
#   Site settings > Environment variables
# (voir README.md pour les valeurs exactes)

# ⏰ Tâche programmée : rappels de rendez-vous automatiques (toutes les heures)
[functions."reminders"]
schedule = "@hourly"
